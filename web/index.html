<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="looks.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* jb-phone: ./?desk=1 = the computer layout on a phone */ if(/[?&]desk=1/.test(location.search)){ document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=1280, viewport-fit=cover'); }</script>
<title>Alex Hale's Board</title>
<link rel="manifest" href="manifest-dashboard.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alex Hale's Board">
<meta name="theme-color" content="#04101f">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="fonts/plex.css">
<script src="theme.js"></script>
<script src="channel-link.js"></script>
<style>
  :root{--bg:#04101f;--panel:#071a30;--line-bright:#164060;--green:#00ff41;--red:#ff3b30;--white:#f2f2f2;--dim:#6f8aa3;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--white);overflow:hidden;
    font-family:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;-webkit-font-smoothing:antialiased;}
  body{display:flex;flex-direction:column;height:100vh;height:100dvh;
    padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) 0 env(safe-area-inset-left,0);}
  #bar{display:flex;align-items:flex-end;gap:2px;background:var(--panel);border-bottom:1px solid var(--line-bright);
    padding:8px 8px 0;flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  #bar::-webkit-scrollbar{display:none;}
  .brand{font-size:11px;letter-spacing:.1em;color:var(--dim);padding:0 10px 10px 4px;white-space:nowrap;}
  .tab{background:transparent;border:1px solid transparent;border-bottom:none;color:var(--dim);font:inherit;font-size:13px;
    font-weight:600;padding:9px 14px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;position:relative;top:1px;}
  .tab.active{background:var(--bg);color:var(--white);border-color:var(--line-bright);}
  .tab[hidden]{display:none;}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:var(--dim);vertical-align:1px;}
  .dot.ok{background:var(--green);box-shadow:0 0 6px var(--green);}
  .dot.bad{background:var(--red);}
  #panes{flex:1;position:relative;}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg);}
  iframe.active{display:block;}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px;padding:20px;text-align:center;}
  .xlink{color:var(--dim);text-decoration:none;font-size:12px;padding:9px 10px;white-space:nowrap;align-self:center;flex-shrink:0;}
  #jb-theme.xtra{margin:0 18px 6px 4px;align-self:center;flex-shrink:0;}
  @media (max-width:560px){ .brand{display:none;} .tab{padding:9px 11px;font-size:12px;} }
  /* jb-tabwrap (jb-calendar): on a computer screen the tabs wrap onto a second line instead of running off the page */
  @media (min-width:561px){ #bar{flex-wrap:wrap;overflow-x:visible;row-gap:2px;} }
  /* jb-tabgrid (jb-layout2): on a wide computer screen the tabs sit in two even rows (9 each since jb-reportcard) */
  @media (min-width:1100px){
    #bar{display:grid;grid-template-columns:max-content repeat(9,minmax(0,1fr)) max-content max-content;align-items:end;column-gap:2px;}
    #bar .brand{grid-column:1;grid-row:1 / span 2;align-self:center;}
    #bar .xlink{grid-column:11;grid-row:1;}
    #bar #jb-theme{grid-column:11;grid-row:2;margin:0 8px 6px 4px;}
    #bar #lgBtn{grid-column:12;grid-row:1 / span 2;margin-left:0;}
    #bar .tab{padding:9px 6px;text-align:center;overflow:hidden;text-overflow:ellipsis;}
  }
</style>
</head>
<body>
<div id="bar">
  <span class="brand">ALEX HALE'S BOARD</span>
  <button class="tab" data-tab="ibkr" data-src="ibkr.html" data-health="ibkr"><span class="dot"></span>IBKR</button>
  <button class="tab" data-tab="webull" data-src="webull.html" data-health="webull"><span class="dot"></span>Webull</button>
  <button class="tab" data-tab="world" data-src="world.html" data-health="gateway"><span class="dot"></span>World</button>
  <button class="tab" data-tab="scanner" data-src="movers.html" data-health="scanner"><span class="dot"></span>Scanner</button>
  <button class="tab" data-tab="algo-webull" data-src="algo.html?name=webull" data-health="algo_webull"><span class="dot"></span>Webull Algo</button>
  <button class="tab" data-tab="algo-ibkr" data-src="algo.html?name=ibkr" data-health="algo_ibkr"><span class="dot"></span>IBKR Algo</button>
  <button class="tab" data-tab="portfolio" data-src="portfolio.html" data-health="gateway"><span class="dot"></span>Portfolio</button>
  <button class="tab" data-tab="news" data-src="news.html" data-health="gateway"><span class="dot"></span>News</button>
  <button class="tab" data-tab="signals" data-src="signals.html" data-health="gateway"><span class="dot"></span>Signals</button>
  <button class="tab" data-tab="night" data-src="night.html" data-health="gateway"><span class="dot"></span>Night Desk</button>
  <button class="tab" data-tab="macro" data-src="macro.html" data-health="gateway"><span class="dot"></span>Macro</button>
  <button class="tab" data-tab="claude" data-src="claude.html" data-health="gateway"><span class="dot"></span>Ask Claude</button>
  <button class="tab" data-tab="analysis" data-src="analysis.html" data-health="gateway"><span class="dot"></span>Analysis</button>
  <button class="tab" data-tab="trading" data-src="trading.html" data-health="gateway"><span class="dot"></span>My Trading</button>
  <button class="tab" data-tab="recap" data-src="recap.html" data-health="gateway"><span class="dot"></span>Recap</button>
  <button class="tab" data-tab="chart" data-src="chart.html" data-health="gateway"><span class="dot"></span>Chart</button>
  <button class="tab" data-tab="report" data-src="report.html" data-health="gateway"><span class="dot"></span>Report Card</button>
  <button class="tab" data-tab="health" data-src="health.html" data-health="gateway"><span class="dot"></span>Health</button>
  <a class="xlink" href="phone.html" title="The phone page: one screen with the essentials. Add it to your phone's home screen.">Phone</a>
  <button id="jb-theme" class="xtra"></button>
</div>
<div id="panes"><div id="msg">Loading…</div></div>
<script>
(function(){
  'use strict';
  var tabs = [].slice.call(document.querySelectorAll('.tab'));
  var panes = document.getElementById('panes'), frames = {}, current = null;
  function saved(){ try{ return localStorage.getItem('jb_dash_tab'); }catch(e){ return null; } }
  function fromHash(){ var h = (location.hash || '').replace('#', ''); return h || null; }
  window.addEventListener('hashchange', function(){ if(fromHash()) show(fromHash()); });
  function remember(t){ try{ localStorage.setItem('jb_dash_tab', t); }catch(e){} }

  // Each board loads the first time its tab is opened and then stays alive in the background
  // (keeps its live connection + price history). Hidden boards are told to stop drawing.
  function show(name){
    var btn = tabs.filter(function(b){ return b.dataset.tab === name && !b.hidden; })[0] ||
              tabs.filter(function(b){ return !b.hidden; })[0];
    if(!btn) return;
    name = btn.dataset.tab;
    if(!frames[name]){
      var f = document.createElement('iframe');
      f.src = btn.dataset.src; f.title = btn.textContent.trim();
      panes.appendChild(f); frames[name] = f;
    }
    tabs.forEach(function(b){ b.classList.toggle('active', b === btn); });
    Object.keys(frames).forEach(function(k){
      var on = k === name;
      frames[k].classList.toggle('active', on);
      try{ frames[k].contentWindow.postMessage({type:'jb-visibility', visible:on}, location.origin); }catch(e){}
    });
    document.getElementById('msg').style.display = 'none';
    current = name; remember(name);
  }
  tabs.forEach(function(b){ b.addEventListener('click', function(){ show(b.dataset.tab); }); });
  // a board that finishes loading after the switch still needs to know whether it's visible
  panes.addEventListener('load', function(){ if(current) show(current); }, true);

  var first = true;
  function health(){
    fetch('/api/health', {credentials:'same-origin', cache:'no-store'}).then(function(r){
      if(r.status === 401){ location.href = '/login?next=/'; return null; }
      return r.ok ? r.json() : null;
    }).then(function(h){
      if(!h) return;
      tabs.forEach(function(b){
        var s = h[b.dataset.health] || {};
        if(s.enabled === false){ b.hidden = true; return; }
        b.hidden = false;
        var algo = b.dataset.health.indexOf('algo_') === 0;
        b.querySelector('.dot').className = 'dot ' + (s.up ? 'ok' : (algo && s.backtest_age_s != null ? '' : 'bad'));
        b.title = s.up ? 'running' : (algo ? 'paper trader not running (backtest results may still be shown)' : 'not running on the spare Mac');
      });
      if(first){ first = false; show(fromHash() || saved() || 'ibkr'); }
    }).catch(function(){
      if(first){ first = false; show(fromHash() || saved() || 'ibkr'); }
    });
  }
  health(); setInterval(health, 10000);
})();
</script>

<script src="rc-badges.js"></script>
<script src="navbar.js"></script>
<script src="legend.js"></script>

</body>
</html>
