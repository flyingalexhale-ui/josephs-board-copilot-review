# Overnight gap, Webull copy (paper first!). The same idea as ibkr-algo/strategies/overnight_gap.yaml: a stock that is
# still up at least 0.5% vs. the 4 pm close in the LAST 30 MINUTES OF AFTER-HOURS (7:30-8:00 pm New York time) often
# carries that strength through the night. Buy then, hold overnight, sell at the 9:30 open -- or earlier on the
# stop-loss / take-profit, which the algo checks all night.
#   * Monday to Thursday evenings only, and never the evening before a market holiday (no buying into a weekend or a
#     holiday).
#   * Webull: the stop-loss and take-profit need overnight PRICES, which need Webull's overnight data plan. Without it,
#     the algo never trades overnight (and this strategy holds through the night with no stop watching it) -- the
#     Webull algo tab says whether overnight prices are on right now. Once the plan has them, the algo picks them up by
#     itself within a few hours (or at 7:45 pm ET); no change to this file is needed.
#   * Backtest it on Webull data from the algo tab (the last 1,200 one-minute bars from Webull, overnight included when
#     the plan has it), or on the Webull board's own record:  ./jb backtest webull strategies/overnight_gap.yaml --recorded
#     (the board records overnight prices once the plan has them; IBKR's record has them already).
#   * Try it in PAPER mode for a few weeks before ever thinking about live. Change the symbol below to the stock you
#     want it to trade (it must trade in Webull's overnight session: the 24H list in the Webull app).
name: "Overnight gap, Webull (buy late after-hours, sell at the open)"
symbol: "AAPL"

indicators:
  - kind: clock        # clock_minute_et (19:30 = 1170), clock_session (3 regular, 4 after-hours), clock_weekday (0 Mon), clock_next_day_open (0 before a holiday)
  - kind: vs_close     # vs_close_prev (the 4 pm close), vs_close_pct (% vs that close)

entry:
  side: buy
  when: "clock_session == 4 and clock_minute_et >= 1170 and clock_weekday <= 3 and clock_next_day_open == 1 and vs_close_pct >= 0.5"

exit:
  when: "clock_session == 3"      # the first regular-hours minute: sell at the open

position_size:
  pct_of_equity: 25

risk:
  stop_loss_pct: 2          # sell if it drops 2% below the buy price (checked overnight too, when Webull sends overnight prices)
  take_profit_pct: 4        # sell if it rises 4% above the buy price
  max_order_notional_usd: 25000   # live-mode only; ignored in paper/backtest

max_open_positions: 1

# Sessions this strategy needs (the algo tab's Trading options panel overrides this once you
# press Save there -- then tick Pre-market, After-hours and Overnight in its Paper column).
trading:
  paper_sessions: [premarket, afterhours, overnight]
  live_sessions: []
  order_type: limit

confirm_live: false
